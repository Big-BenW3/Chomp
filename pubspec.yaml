name: chomp
description: GitHub analytics, watched by AI, on your phone.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Auth / networking
  flutter_web_auth_2: ^5.0.0
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2

  # State management
  flutter_riverpod: ^2.5.1

  # Notifications
  flutter_local_notifications: ^17.2.2
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0

  # UI

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.0
  flutter_dotenv: ^5.1.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - .env

flutter_native_splash:
  color: "#0E0B12"
  color_dark: "#0E0B12"
  android_12:
    color: "#0E0B12"
    color_dark: "#0E0B12"